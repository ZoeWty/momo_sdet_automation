name: momo search tests

on:
  # Offline helper tests gate every push: they need no browser and no network,
  # so running them automatically costs nothing and cannot hit the live site.
  push:
  pull_request:
  # The UI smoke talks to momo's production site, so it stays manual rather
  # than running on a schedule against a site we do not own.
  workflow_dispatch:

jobs:
  helpers:
    name: offline helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_parsers.py --junitxml=helpers.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-results
          path: helpers.xml
          if-no-files-found: ignore

  smoke:
    name: live smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m smoke --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momo-search-test-results
          path: |
            pytest.xml
            test-results/
          if-no-files-found: ignore
